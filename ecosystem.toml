# ecosystem.toml — опис екосистеми Kambala для l2l1-kit/sync.py (корінь = місце цього файлу)
name = "Kambala"
tags_reserved = ["DDL", "STC", "SRC", "DAI", "HUB"]
table_note = "`docs/` (ТЗ `technical_specification.md`, мануал FlyByIP IP-Video v1.3) — частина meta-репозиторію кореня, зона Gans і Claude."

[[projects]]
dir = "server"
tag = "KSRV"
ssot = "SRV"
title = "Ground Control Server"
target = "VPS `kambala.net` (Київ), локально — цей ПК"
rules = "деплой на VPS і зміни WireGuard/NAT — лише за командою Gans; секрети тільки в `.env`"
hil = false
local = "bootstrap/server.agents.local.md"

[[projects]]
dir = "workstation"
tag = "KWS"
ssot = "WS"
title = "Operator Workstation"
target = "Raspberry Pi 4, два дисплеї"
rules = "`hil_required: true` для всього, що перевіряється на RPi 4"
hil = true
local = "bootstrap/workstation.agents.local.md"

[[projects]]
dir = "node-sim"
tag = "KSIM"
ssot = "SIM"
title = "Node Simulator"
target = "Raspberry Pi 5 (замість Streamer+MikroTik)"
rules = "інтерфейс = реальний FlyByIP Streamer; не видаляти після появи заліза"
hil = false
local = "bootstrap/node-sim.agents.local.md"

[[planned]]
dir = "node"
tag = "KNODE"
title = "Node firmware"
target = "Pico 2 (CAN, PoE-лінія)"
rules = "HIL-gate обов'язковий"

[[planned]]
dir = "qgc-plugin"
tag = "KQGC"
title = "QGC plugin"
target = "пілотські ПК"
rules = "Фаза 2"
